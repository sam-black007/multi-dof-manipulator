name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov ruff

      - name: Lint with ruff
        run: |
          ruff check core/ hardware/ simulation/ tests/ examples/ --fail-under 0 || true

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=core --cov=hardware --cov=simulation --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and build
        run: |
          pip install -r requirements.txt
          pip install -e .
          python -c "from core.configuration import RobotConfiguration; c = RobotConfiguration.load('config/robot_a.yaml'); print(f'Loaded {c.name}, DOF={c.dof}')"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t multi-dof-manipulator:latest .
          docker run --rm multi-dof-manipulator:latest python -c "from core.configuration import RobotConfiguration; print('Docker image works')"
