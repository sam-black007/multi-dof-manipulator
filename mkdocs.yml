site:
  repo: sam-black007/multi-dof-manipulator
  name: Multi-DOF Manipulator
  logo: images/circuit_diagram.png

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest

plugins:
  - search
  - mkdocstrings

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API Reference:
    - Core: api/core.md
    - Hardware: api/hardware.md
    - Simulation: api/simulation.md
  - Tutorials:
    - Quick Start: tutorials/quick_start.md
    - Adding a New Robot: tutorials/new_robot.md
    - Calibration: tutorials/calibration.md
  - Architecture: architecture.md

docs_dir: docs
site_dir: docs
